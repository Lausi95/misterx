services:
  city-game-api:
    image: ghcr.io/lausi95/city-game/city-game-api:latest
    networks: [ traefik ]
    environment:
      SPRING_PROFILES_ACTIVE: k8s
      SPRING_DATASOURCE_URL: jdbc:postgresql://city-game-api-postgres:5432/city-game
      SPRING_DATASOURCE_USERNAME: city-game
      SPRING_DATASOURCE_PASSWORD: city-game
    labels:
      - traefik.enable=true
      - traefik.http.routers.cgb.rule=Host(`city-game-backend.lausi95.net`)
      - traefik.http.routers.cgb.entrypoints=websecure
      - traefik.http.routers.cgb.tls.certresolver=letsencrypt

  city-game-api-postgres:
    image: 'postgres:latest'
    networks: [ traefik ]
    environment:
      POSTGRES_DB: city-game
      POSTGRES_PASSWORD: city-game
      POSTGRES_USER: city-game

networks:
  traefik:
    external: true
    name: traefik
