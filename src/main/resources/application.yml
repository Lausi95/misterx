keycloak-realm: ${KEYCLOAK_REALM:https://auth.lausi95.net/realms/city-game}

spring:
  application:
    name: misterx
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak-realm}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  docker:
    compose:
      lifecycle-management: start_only

tenant:
  override:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Only expose health publicly (Traefik healthcheck); never env/beans/mappings.
        include: health

logging:
  level:
    root: warn
    net.lausi95.citygame: info
  include-application-group: false
  include-application-name: false

